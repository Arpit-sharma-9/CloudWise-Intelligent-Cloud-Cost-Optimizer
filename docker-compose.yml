version: '3.8'

services:
  # Backend Service (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudwise-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:./cloudwise.db
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.sqlite.JDBC
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.community.dialect.SQLiteDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-your_aws_access_key}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY:-your_aws_secret_key}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key}
    volumes:
      - ./backend/data:/app  # Persist SQLite database
    networks:
      - cloudwise-network
    restart: unless-stopped

  # Frontend Service (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudwise-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cloudwise-network
    restart: unless-stopped

networks:
  cloudwise-network:
    driver: bridge
