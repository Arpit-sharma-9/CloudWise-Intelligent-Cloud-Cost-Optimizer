# Server Configuration
server.port=8080

# SQLite Database Configuration (Zero-config, file-based)
spring.datasource.url=jdbc:sqlite:./cloudwise.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AWS Configuration (Loaded from environment variables)
aws.accessKeyId=${AWS_ACCESS_KEY_ID:your_access_key}
aws.secretKey=${AWS_SECRET_KEY:your_secret_key}
aws.region=${AWS_REGION:us-east-1}

# JWT Configuration (for User Authentication)
jwt.secret=${JWT_SECRET:your_jwt_secret_key}
jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.cloudwise=DEBUG
