# ===================================================================
# CloudWise - Application Configuration
# ===================================================================

# Server Configuration
server.port=8080

# Application Name
spring.application.name=CloudWise

# ===================================================================
# H2 Database Configuration
# ===================================================================
spring.datasource.url=jdbc:h2:mem:cloudwise
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# Automatically create database tables based on entity classes
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in the console (helpful while learning)
spring.jpa.show-sql=true

# Format the SQL output nicely
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# H2 Console Configuration
# Accessible at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:cloudwise
# Username: sa
# Password: (leave empty)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.com.cloudwise=debug
